ode_distill:
  enable: true
  student_checkpoint_path: /root/autodl-tmp/wall_x/workspace/v6_ode_distill/smoke_step6
  teacher_num_inference_timesteps: 10
  student_num_inference_timesteps: 6
  allow_ode_cache: false
  allow_ode_early_stop: false
  lora:
    enable: true
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules:
    - q_proj
    - v_proj
data:
  dataset_root: /root/autodl-tmp/wall_x/datasheet/libero_all
  repo_id: libero_all
  image_key: observation.images.faceImg
  train_samples: 1
  val_samples: 1
  sample_strategy: linspace
v6_runtime:
  standalone_student: true
  ode_cache_enable: false
  ode_early_stop_enable: false
training:
  epochs: 0
  learning_rate: 1.0e-05
  weight_decay: 0.0
  grad_clip: 1.0
  seed: 1234
model_path: /root/autodl-tmp/wall_x/pretrained/wall-oss-fast
vispruner:
  enable: false
  keep_ratio: 0.5
  strategy: topk_attention
